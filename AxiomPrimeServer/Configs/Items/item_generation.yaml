# Item generation configuration
# Settings for random item generation in the simulation

# Size configuration
size:
  # Base size increase interval (every X levels, size increases by 1)
  levelInterval: 20

  # Minimum item size (always at least this value)
  minimumSize: 1

  # Random size variation
  randomVariation:
    # Chance for item to be +1 larger than base size (0.0 - 1.0)
    plusOneChance: 0.05

    # Chance for item to be -1 smaller than base size (0.0 - 1.0)
    minusOneChance: 0.05

# Item value configuration
value:
  # Base modifier for item value calculation
  baseModifier: 10.0

  # Random variance in item value (0.1 = ±10%)
  randomVariance: 0.1
